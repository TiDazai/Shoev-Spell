name: Build release DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must match the app version)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Create DMG
        run: ./scripts/create-dmg.sh
      - name: Verify artifact
        run: hdiutil verify dist/Shoev-Spell.dmg
      - name: Attach DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/Shoev-Spell.dmg
