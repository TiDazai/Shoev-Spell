name: Build release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must match the app version)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Create DMG
        run: ./scripts/create-dmg.sh
      - name: Verify artifact
        run: hdiutil verify dist/Shoev-Spell.dmg
      - name: Attach DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes || gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/Shoev-Spell.dmg --clobber

  windows-release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows x64 build
        run: dotnet publish windows/ShoevSpell.Windows/ShoevSpell.Windows.csproj -c Release -r win-x64 --self-contained true -o dist/windows
      - name: Verify Windows build
        shell: pwsh
        run: |
          & "dist/windows/Shoev Spell.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Windows self-test failed" }
      - name: Create Windows archive
        shell: pwsh
        run: Compress-Archive -Path dist/windows/* -DestinationPath dist/Shoev-Spell-Windows-x64.zip
      - name: Attach Windows build to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:RELEASE_TAG --verify-tag --draft --generate-notes }
          gh release upload $env:RELEASE_TAG dist/Shoev-Spell-Windows-x64.zip --clobber
