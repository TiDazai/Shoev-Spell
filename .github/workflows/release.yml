name: Build release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal application
        run: ./scripts/build-app.sh
      - name: Create DMG
        run: ./scripts/create-dmg.sh
      - name: Verify artifact
        run: hdiutil verify dist/Shoev-Spell.dmg
      - name: Attach DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes || gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/Shoev-Spell.dmg --clobber

  windows-release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows x64 build
        run: dotnet publish windows/ShoevSpell.Windows/ShoevSpell.Windows.csproj -c Release -r win-x64 --self-contained true -o dist/windows
      - name: Verify Windows build
        shell: pwsh
        run: |
          $core = Start-Process -FilePath "dist/windows/Shoev Spell.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($core.ExitCode -ne 0) { throw "Core self-test failed" }
          $input = Start-Process -FilePath "dist/windows/Shoev Spell.exe" -ArgumentList "--input-self-test" -Wait -PassThru
          if ($input.ExitCode -ne 0) { throw "Input self-test failed" }
      - name: Create Windows archive
        shell: pwsh
        run: Compress-Archive -Path dist/windows/* -DestinationPath dist/Shoev-Spell-x64.zip
      - name: Attach Windows build to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:RELEASE_TAG --generate-notes }
          gh release upload $env:RELEASE_TAG dist/Shoev-Spell-x64.zip --clobber
