name: Build release DMG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal application
        run: ./scripts/build-app.sh
      - name: Create DMG
        run: ./scripts/create-dmg.sh
      - name: Verify artifact
        run: hdiutil verify dist/Shoev-Spell.dmg
      - name: Attach DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0 dist/Shoev-Spell.dmg --clobber
